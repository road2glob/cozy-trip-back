  /v1/paypal/confirm-return:
    post:
      summary: confirm-return
      operationId: post_confirm-return
      description: Service Binding only. Exactly one of charge_id or payment_id, plus
        return_token. payment_id is an opaque settlement ID; never accept caller PayPal
        order IDs. Return reconciles; cancel never captures an uncaptured order or marks
        refunded. Response is ConfirmResult for charge_id, SettlementOrder for
        payment_id.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
