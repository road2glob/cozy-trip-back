components:
  securitySchemes:
    ProductBearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    Approval:
      type: object
      properties:
        approvalId:
          type: string
        runId:
          type: string
        gate:
          type: string
          enum:
            - before-execute
            - before-charge
        state:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - expired
        approvalToken:
          type: string
        expiresAt:
          type: string
        actorType:
          type: string
        actorRef:
          type: string
        decidedAt:
          type: string
        comment:
          type: string
          maxLength: 280
      required:
        - approvalId
        - gate
        - state
        - approvalToken
        - expiresAt
    Step:
      type: object
      properties:
        stepId:
          type: string
        runId:
          type: string
        seq:
          type: integer
        name:
          type: string
          enum:
            - approval
            - payment
            - execute
            - verify
            - receipt
        state:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - skipped
        startedAt:
          anyOf:
            - type: string
            - type: "null"
        finishedAt:
          anyOf:
            - type: string
            - type: "null"
        detail:
          type: string
      required:
        - stepId
        - runId
        - seq
        - name
        - state
        - startedAt
        - finishedAt
        - detail
    Charge:
      type: object
      properties:
        chargeId:
          type: string
        runId:
          type: string
        productId:
          type: string
        state:
          type: string
          enum:
            - awaiting-payment
            - captured
            - failed
            - void
            - refund-required
            - refunded
        amountMinor:
          const: 990
        currency:
          const: USD
        approveUrl:
          anyOf:
            - type: string
            - type: "null"
        paypalOrderId:
          anyOf:
            - type: string
            - type: "null"
        paypalCaptureId:
          anyOf:
            - type: string
            - type: "null"
        paypalRequestId:
          type: string
        paypalEnvironment:
          const: sandbox
        createdAt:
          type: string
        capturedAt:
          anyOf:
            - type: string
            - type: "null"
      required:
        - chargeId
        - state
        - amountMinor
        - currency
        - approveUrl
        - paypalOrderId
        - paypalEnvironment
    Verification:
      type: object
      properties:
        verificationId:
          type: string
        runId:
          type: string
        state:
          type: string
          enum:
            - passed
            - failed
        method:
          const: json-schema
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              passed:
                type: boolean
              detail:
                type: string
            required:
              - name
              - passed
              - detail
        outputDigest:
          type: string
        verifiedAt:
          type: string
      required:
        - verificationId
        - runId
        - state
        - method
        - checks
        - outputDigest
        - verifiedAt
    Receipt:
      type: object
      properties:
        receiptId:
          type: string
        runId:
          type: string
        state:
          const: issued
        verificationState:
          type: string
          enum:
            - passed
            - failed
            - not-run
        chargeOutcome:
          type: string
          enum:
            - none
            - captured
            - refund-required
            - refunded
            - void
        chargeId:
          anyOf:
            - type: string
            - type: "null"
        amountMinor:
          type: integer
          minimum: 0
        currency:
          const: USD
        inputDigest:
          type: string
        outputDigest:
          anyOf:
            - type: string
            - type: "null"
        reason:
          anyOf:
            - type: string
            - type: "null"
        issuedAt:
          type: string
        mode:
          const: sandbox
      required:
        - receiptId
        - runId
        - state
        - verificationState
        - chargeOutcome
        - chargeId
        - amountMinor
        - currency
        - inputDigest
        - outputDigest
        - reason
        - issuedAt
        - mode
    Workflow:
      type: object
      properties:
        schemaVersion:
          const: "20261104"
        mode:
          const: sandbox
        workflowId:
          type: string
        productId:
          const: cozytrip
        version:
          type: string
        title:
          type: string
        price:
          type: object
          properties:
            currency:
              const: USD
            amountMinor:
              type: integer
              enum:
                - 0
                - 990
            unit:
              const: verified-result
          required:
            - currency
            - amountMinor
            - unit
        approvalGates:
          type: array
          items:
            type: string
            enum:
              - before-execute
              - before-charge
        status:
          type: string
          enum:
            - active
            - retired
      required:
        - schemaVersion
        - mode
        - workflowId
        - productId
        - version
        - title
        - price
        - approvalGates
        - status
    Run:
      type: object
      properties:
        schemaVersion:
          const: "20261104"
        mode:
          const: sandbox
        runId:
          type: string
        workflowId:
          type: string
        workflowVersion:
          type: string
        productId:
          type: string
        subjectId:
          type: string
        idempotencyKey:
          type: string
        input:
          type: object
        inputDigest:
          type: string
        state:
          type: string
          enum:
            - awaiting-approval
            - awaiting-payment
            - running
            - verifying
            - verified
            - failed
            - rejected
            - cancelled
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        output:
          anyOf:
            - type: object
            - type: "null"
        outputDigest:
          anyOf:
            - type: string
            - type: "null"
        approvalId:
          anyOf:
            - type: string
            - type: "null"
        chargeId:
          anyOf:
            - type: string
            - type: "null"
        verificationId:
          anyOf:
            - type: string
            - type: "null"
        receiptId:
          anyOf:
            - type: string
            - type: "null"
        error:
          anyOf:
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
              required:
                - code
                - message
            - type: "null"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - schemaVersion
        - mode
        - runId
        - workflowId
        - workflowVersion
        - productId
        - subjectId
        - idempotencyKey
        - input
        - inputDigest
        - state
        - steps
        - output
        - outputDigest
        - approvalId
        - chargeId
        - verificationId
        - receiptId
        - error
        - createdAt
        - updatedAt
    CreatedRun:
      type: object
      properties:
        schemaVersion:
          const: "20261104"
        mode:
          const: sandbox
        runId:
          type: string
        state:
          type: string
          enum:
            - awaiting-approval
            - awaiting-payment
            - running
            - verifying
            - verified
            - failed
            - rejected
            - cancelled
        approval:
          anyOf:
            - $ref: "#/components/schemas/Approval"
            - type: "null"
        output:
          type: "null"
        chargeId:
          type: "null"
      required:
        - schemaVersion
        - mode
        - runId
        - state
        - approval
        - output
        - chargeId
    ConfirmResult:
      type: object
      properties:
        runId:
          type: string
        state:
          type: string
          enum:
            - awaiting-approval
            - awaiting-payment
            - running
            - verifying
            - verified
            - failed
            - rejected
            - cancelled
        charge:
          $ref: "#/components/schemas/Charge"
      required:
        - runId
        - state
        - charge
    IssueInput:
      type: object
      properties:
        tripId:
          type: string
          minLength: 1
        bookingIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
      required:
        - tripId
        - bookingIds
      additionalProperties: false
      description: 待 CozyTrip 确认：本地最小 Schema，字段名保持不变。
      x-cozytrip-confirmation: pending
    IssueOutput:
      type: object
      properties:
        affectedBookingIds:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        summary:
          type: string
          minLength: 1
      required:
        - affectedBookingIds
      additionalProperties: false
      description: 待 CozyTrip 确认：本地最小 Schema，字段名保持不变。
      x-cozytrip-confirmation: pending
    AftersalesInput:
      type: object
      properties:
        tripId:
          type: string
          minLength: 1
        bookingIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        issueId:
          type: string
          minLength: 1
      required:
        - tripId
        - bookingIds
        - issueId
      additionalProperties: false
    AftersalesOutput:
      type: object
      properties:
        serviceOrderId:
          type: string
          minLength: 1
        trackingState:
          const: prepared
        materials:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              kind:
                type: string
                minLength: 1
              text:
                type: string
                minLength: 1
            required:
              - kind
              - text
            additionalProperties: false
      required:
        - serviceOrderId
        - trackingState
        - materials
      additionalProperties: false
    SplitInput:
      type: object
      properties:
        tripId:
          type: string
          minLength: 1
        totalMinor:
          type: integer
          minimum: 0
        participantIds:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: CozyTrip 传入 Maya / Leo / Ava 对应的不透明 participantIds；三人合计 18000，每人 6000。
      required:
        - tripId
        - totalMinor
        - participantIds
      additionalProperties: false
      description: 待 CozyTrip 确认：本地最小 Schema，字段名保持不变。
      x-cozytrip-confirmation: pending
    SplitOutput:
      type: object
      properties:
        shares:
          type: array
          items:
            type: object
            properties:
              participantId:
                type: string
                minLength: 1
              amountMinor:
                type: integer
            required:
              - participantId
              - amountMinor
            additionalProperties: false
        totalMinor:
          type: integer
      required:
        - shares
        - totalMinor
      additionalProperties: false
      description: 待 CozyTrip 确认：本地最小 Schema，字段名保持不变。
      x-cozytrip-confirmation: pending
    CreateRunRequest:
      oneOf:
        - type: object
          properties:
            workflowId:
              const: cozytrip.issue.assess
            subjectId:
              type: string
              minLength: 1
            input:
              $ref: "#/components/schemas/IssueInput"
            mode:
              const: sandbox
          required:
            - workflowId
            - subjectId
            - input
        - type: object
          properties:
            workflowId:
              const: cozytrip.aftersales.deliver
            subjectId:
              type: string
              minLength: 1
            input:
              $ref: "#/components/schemas/AftersalesInput"
            mode:
              const: sandbox
          required:
            - workflowId
            - subjectId
            - input
        - type: object
          properties:
            workflowId:
              const: cozytrip.split.calculate
            subjectId:
              type: string
              minLength: 1
            input:
              $ref: "#/components/schemas/SplitInput"
            mode:
              const: sandbox
          required:
            - workflowId
            - subjectId
            - input
    OutputRequest:
      type: object
      properties:
        output:
          oneOf:
            - $ref: "#/components/schemas/IssueOutput"
            - $ref: "#/components/schemas/AftersalesOutput"
            - $ref: "#/components/schemas/SplitOutput"
      required:
        - output
      additionalProperties: false
    SettlementOrder:
      type: object
      required:
        - paymentId
        - amountMinor
        - currency
        - mode
        - state
        - paypalOrderId
        - paypalCaptureId
        - approveUrl
        - paypalRequestId
        - disclaimer
      properties:
        paymentId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,32}$
        amountMinor:
          const: 6000
        currency:
          const: USD
        mode:
          const: sandbox
        state:
          type: string
          enum:
            - awaiting-payment
            - captured
            - failed
            - void
        paypalOrderId:
          type:
            - string
            - "null"
        paypalCaptureId:
          type:
            - string
            - "null"
        paypalRequestId:
          type: string
        approveUrl:
          type:
            - string
            - "null"
        createdAt:
          type: string
        capturedAt:
          type:
            - string
            - "null"
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        disclaimer:
          const: "Sandbox demo: funds go to a sandbox account, not a real person-to-person
            transfer."
