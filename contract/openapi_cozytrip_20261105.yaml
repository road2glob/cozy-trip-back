  /v1/settlement-orders:
    post:
      operationId: createSettlement
      summary: Create USD 60 Sandbox settlement order
      description: Idempotent by paymentId (1–32 ASCII alphanumeric, underscore, or hyphen). A
        repeated paymentId returns the existing order. Only amountMinor=6000 and USD are
        accepted. Status is observed by polling GET.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - paymentId
                - amountMinor
              properties:
                paymentId:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,32}$
                amountMinor:
                  const: 6000
                currency:
                  const: USD
                mode:
                  const: sandbox
      responses:
        "200":
          description: Settlement order. Does not create a Charge, Run, or Receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementOrder"
        "201":
          description: Settlement order. Does not create a Charge, Run, or Receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementOrder"
        "400":
          description: Invalid input / authentication / missing resource / contention or upstream
            error; see error.code. Contention is retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid input / authentication / missing resource / contention or upstream
            error; see error.code. Contention is retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid input / authentication / missing resource / contention or upstream
            error; see error.code. Contention is retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invalid input / authentication / missing resource / contention or upstream
            error; see error.code. Contention is retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Invalid input / authentication / missing resource / contention or upstream
            error; see error.code. Contention is retryable.
          content:
            application/json:
              schema:
