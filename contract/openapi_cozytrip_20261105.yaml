openapi: 3.1.0
info:
  title: Payment & verification service
  version: "20261104.2"
  description: "Payment & verification service contract consumed by CozyTrip. Reached via
    a Cloudflare Service Binding named TASKPASS; requests carry `Authorization: Bearer
    <product token>`."
servers:
  - url: https://taskpass.internal
    description: Service Binding; not publicly reachable
security:
  - ProductBearer: []
paths:
  /v1/workflows/{workflowId}:
    get:
      summary: Read workflow
      operationId: get_Read_workflow
      description: ""
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          description: Invalid request or signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid product credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid approval or return token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: State conflict / idempotency-conflict / operation-in-progress; retry
            transient contention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Body exceeds 256 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal failure; no sensitive details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: PayPal unavailable; safely retry same operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Invalid sandbox configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
